<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
          content="#17375e">

    <title>Phone Accessories Manager</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="top-header">

    <div class="header-content">

        <h1>
            📱 Accessories Manager
        </h1>

        <p>
            Stock & Sales Record
        </p>

    </div>

</header>



<!-- =====================================================
     NAVIGATION
===================================================== -->

<nav class="navigation">

    <button
        class="nav-btn active"
        onclick="showSection('dashboard', this)">

        🏠 Dashboard

    </button>


    <button
        class="nav-btn"
        onclick="showSection('products', this)">

        📦 Products

    </button>


    <button
        class="nav-btn"
        onclick="showSection('sales', this)">

        💰 Sales

    </button>


    <button
        class="nav-btn"
        onclick="showSection('history', this)">

        🧾 History

    </button>

</nav>



<!-- =====================================================
     MAIN
===================================================== -->

<main class="container">



<!-- =====================================================
     DASHBOARD
===================================================== -->

<section
    id="dashboard"
    class="section active">


    <div class="section-title">

        <div>

            <h2>
                Dashboard
            </h2>

            <p>
                Quick overview of your business
            </p>

        </div>

    </div>



    <!-- STATISTICS -->

    <div class="stats-grid">


        <div class="stat-card">

            <div class="stat-icon">
                📦
            </div>

            <div>

                <span>
                    Total Products
                </span>

                <strong id="totalProducts">
                    0
                </strong>

            </div>

        </div>



        <div class="stat-card">

            <div class="stat-icon">
                📊
            </div>

            <div>

                <span>
                    Total Stock
                </span>

                <strong id="totalStock">
                    0
                </strong>

            </div>

        </div>



        <div class="stat-card">

            <div class="stat-icon">
                💰
            </div>

            <div>

                <span>
                    Total Sales
                </span>

                <strong id="totalSales">
                    ₦0
                </strong>

            </div>

        </div>



        <div class="stat-card">

            <div class="stat-icon">
                ⚠️
            </div>

            <div>

                <span>
                    Low Stock
                </span>

                <strong id="lowStock">
                    0
                </strong>

            </div>

        </div>

    </div>



    <!-- QUICK ACTIONS -->

    <div class="dashboard-box">

        <h3>
            Quick Actions
        </h3>


        <div class="quick-actions">

            <button
                onclick="openProductForm()">

                ➕ Add Product

            </button>


            <button
                onclick="openSaleForm()">

                💰 Record Sale

            </button>

        </div>

    </div>



    <!-- LOW STOCK -->

    <div class="dashboard-box">

        <h3>
            Low Stock Products
        </h3>


        <div id="lowStockList">

            <p class="empty-message">
                No low-stock products.
            </p>

        </div>

    </div>


</section>





<!-- =====================================================
     PRODUCTS
===================================================== -->

<section
    id="products"
    class="section">


    <div class="section-title">

        <div>

            <h2>
